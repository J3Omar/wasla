name: wasla
description: "وصلة — LAN Communication App. Chat, voice & video calls, file sharing on your local network without internet."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Device Identity ---
  flutter_secure_storage: ^9.2.4    # حفظ UUID + اسم الجهاز بأمان
  uuid: ^4.5.1                      # توليد UUID فريد لكل جهاز

  # --- Device Discovery ---
  multicast_dns: ^0.3.2+3           # mDNS — اكتشاف الأجهزة على الـ LAN
  network_info_plus: ^6.1.4         # جلب الـ Local IP للجهاز
  device_info_plus: ^10.1.2         # قراءة اسم الجهاز (model/hostname)

  # --- WebRTC (Audio + Video + Data Channel) ---
  flutter_webrtc: ^0.14.1           # P2P calls + screen share + file transfer

  # --- Local WebSocket Signaling ---
  web_socket_channel: ^3.0.3        # Local WebSocket Server للـ Signaling

  # --- Local Database (Chat History) ---
  drift: ^2.25.0                    # SQLite wrapper — actively maintained
  sqlite3: ^2.9.4                   # Direct SQLite access (chat persistence)
  sqlite3_flutter_libs: ^0.5.30     # SQLite native libs for all platforms
  path: ^1.9.0                      # File path joining

  # --- Permissions ---
  permission_handler: ^11.4.0       # Mic + Camera + Storage permissions

  # --- File Sharing ---
  file_picker: ^8.3.7               # اختيار الملفات للإرسال
  path_provider: ^2.1.5             # مسار حفظ الملفات الواردة
  disk_space_plus: ^0.2.6           # check free disk space on receiver
  mime: ^1.0.5                      # detect file type from extension
  open_file: ^3.3.2                 # open received files
  url_launcher: ^6.3.0              # open links/files

  # --- Notifications ---
  flutter_local_notifications: ^18.0.1  # Android/iOS/Linux system notifications

  # --- State Management ---
  flutter_riverpod: ^2.6.1          # State management
  google_fonts: ^6.2.1              # Hanken Grotesk + Inter + Geist (no .ttf files needed)
  intl: ^0.19.0                     # Date/time formatting for chat timestamps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # --- Drift Code Generation ---
  drift_dev: ^2.25.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Wasla-logo.png"
  background_color: "#121416"
  adaptive_icon_background: "#121416"
  adaptive_icon_foreground: "assets/images/Wasla-logo.png"
  windows:
    generate: true
    image_path: "assets/images/Wasla-logo.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/Wasla-logo.png"
    background_color: "#121416"
