name: Build All Platforms

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Linux deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev pkg-config ninja-build dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package as deb
        run: |
          STAGE="build/debian_package"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/usr/bin" "$STAGE/usr/lib/wasla" "$STAGE/usr/share/applications" "$STAGE/usr/share/pixmaps"
          cp -r build/linux/x64/release/bundle/* "$STAGE/usr/lib/wasla/"
          printf '#!/bin/bash\n/usr/lib/wasla/wasla "$@"\n' > "$STAGE/usr/bin/wasla"
          chmod +x "$STAGE/usr/bin/wasla"
          LOGO=$(find assets/images -name "*.png" | head -1)
          [ -n "$LOGO" ] && cp "$LOGO" "$STAGE/usr/share/pixmaps/wasla.png"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Wasla\nComment=Local P2P Communication App\nExec=wasla\nIcon=wasla\nTerminal=false\nCategories=Network;Chat;\n' > "$STAGE/usr/share/applications/wasla.desktop"
          printf 'Package: wasla\nVersion: 1.0.0\nArchitecture: amd64\nMaintainer: Wasla App <wasla@local>\nDepends: libc6, libgtk-3-0, libglib2.0-0, libsecret-1-0\nSection: net\nPriority: standard\nDescription: Local P2P Communication Application\n Wasla is a decentralized peer-to-peer communication app\n built with Flutter and WebRTC for local network use.\n' > "$STAGE/DEBIAN/control"
          chmod 755 "$STAGE/DEBIAN"
          chmod 644 "$STAGE/DEBIAN/control"
          dpkg-deb --build "$STAGE" "build/wasla_1.0.0_amd64.deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-deb
          path: build/wasla_1.0.0_amd64.deb

  build-windows:
    name: Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package as ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "build\wasla-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst
          Write-Host "ZIP created: $dst"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wasla-windows-zip
          path: build/wasla-windows.zip
