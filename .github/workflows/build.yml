name: Build All Platforms

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev pkg-config ninja-build dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Application as .deb Installer
        run: |
          STAGE_DIR="build/debian_package"
          mkdir -p "$STAGE_DIR/DEBIAN"
          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/wasla"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/usr/share/pixmaps"
          
          cp -r build/linux/x64/release/bundle/* "$STAGE_DIR/usr/lib/wasla/"
          
          echo -e '#!/bin/bash\n/usr/lib/wasla/wasla "$@"' > "$STAGE_DIR/usr/bin/wasla"
          chmod +x "$STAGE_DIR/usr/bin/wasla"
          
          if [ -f "assets/images/wasla_logo.png" ]; then
            cp assets/images/wasla_logo.png "$STAGE_DIR/usr/share/pixmaps/wasla.png"
          elif [ -f "assets/images/Wasla-logo.png" ]; then
            cp assets/images/Wasla-logo.png "$STAGE_DIR/usr/share/pixmaps/wasla.png"
          fi
          
          cat << 'DESKTOP' > "$STAGE_DIR/usr/share/applications/wasla.desktop"
[Desktop Entry]
Version=1.0
Type=Application
Name=Wasla
Comment=Local P2P Communication Application
Exec=wasla
Icon=wasla
Terminal=false
Categories=Network;Chat;
DESKTOP
          
          cat << 'CONTROL' > "$STAGE_DIR/DEBIAN/control"
Package: wasla
Version: 1.0.0
Architecture: amd64
Maintainer: Wasla App <wasla@local>
Depends: libc6, libgtk-3-0, libglib2.0-0, libsecret-1-0
Section: net
Priority: standard
Description: Local P2P Communication Application.
 Wasla is a decentralized, peer-to-peer communication app
 built with Flutter and WebRTC for local network use.
CONTROL
          
          chmod 755 "$STAGE_DIR/DEBIAN"
          chmod 644 "$STAGE_DIR/DEBIAN/control"
          
          dpkg-deb --build "$STAGE_DIR" "build/wasla_1.0.0_amd64.deb"

      - name: Upload Linux .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-deb
          path: build/wasla_1.0.0_amd64.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package as ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "build\wasla-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst
          Write-Host "ZIP created: $dst"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wasla-windows-zip
          path: build/wasla-windows.zip
