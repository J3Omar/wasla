name: Build All Platforms

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:
    inputs:
      branch_note:
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsecret-1-dev \
            pkg-config \
            ninja-build \
            dpkg-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            pulseaudio-utils \
            libfuse2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package as .deb
        run: |
          STAGE_DIR="build/debian_package"
          mkdir -p "$STAGE_DIR/DEBIAN"
          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/wasla"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/usr/share/pixmaps"

          cp -r build/linux/x64/release/bundle/* \
            "$STAGE_DIR/usr/lib/wasla/"

          echo -e '#!/bin/bash\n/usr/lib/wasla/wasla "$@"' \
            > "$STAGE_DIR/usr/bin/wasla"
          chmod +x "$STAGE_DIR/usr/bin/wasla"

          if [ -f "assets/images/Wasla-logo.png" ]; then
            cp assets/images/Wasla-logo.png \
              "$STAGE_DIR/usr/share/pixmaps/wasla.png"
          fi

          cat > "$STAGE_DIR/usr/share/applications/wasla.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Wasla
          Exec=wasla
          Icon=wasla
          Terminal=false
          Categories=Network;Chat;
          EOF

          cat > "$STAGE_DIR/DEBIAN/control" <<EOF
          Package: wasla
          Version: 1.0.0
          Architecture: amd64
          Maintainer: Wasla App <wasla@local>
          Depends: libc6,
           libgtk-3-0,
           libglib2.0-0,
           libsecret-1-0,
           libgstreamer1.0-0,
           gstreamer1.0-plugins-good,
           libgstreamer-plugins-base1.0-0,
           pulseaudio-utils
          Recommends: gstreamer1.0-plugins-bad,
           gstreamer1.0-pipewire
          Section: net
          Priority: standard
          Description: Local P2P Communication Application.
           Wasla is a decentralized peer-to-peer communication app.
          EOF

          chmod 755 "$STAGE_DIR/DEBIAN"
          chmod 644 "$STAGE_DIR/DEBIAN/control"
          dpkg-deb --build "$STAGE_DIR" \
            "build/wasla_1.0.0_amd64.deb"

      - name: Create Portable Tarball for All Distros
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../wasla_1.0.0_linux_portable.tar.gz *
          cd ../../../../../

      - name: Install AppImage Builder Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Create AppDir & Build AppImage
        run: |
          APPDIR="Wasla.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/wasla" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          if [ -f "assets/images/Wasla-logo.png" ]; then
            cp assets/images/Wasla-logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/wasla.png"
            cp assets/images/Wasla-logo.png "$APPDIR/wasla.png"
          fi

          cp build/debian_package/usr/share/applications/wasla.desktop "$APPDIR/wasla.desktop"

          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool "$APPDIR" Wasla-x86_64.AppImage

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-deb
          path: build/wasla_1.0.0_amd64.deb
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

      - name: Upload Linux Portable Tarball
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-portable
          path: wasla_1.0.0_linux_portable.tar.gz
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-appimage
          path: Wasla-x86_64.AppImage
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Download VB-Audio Virtual Cable
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip" `
            -OutFile "vbcable.zip" `
            -UseBasicParsing
          Expand-Archive -Path "vbcable.zip" `
            -DestinationPath "vbcable" -Force

      - name: Download SoundVolumeView
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.nirsoft.net/utils/soundvolumeview-x64.zip" `
            -OutFile "svv.zip" `
            -UseBasicParsing
          Expand-Archive -Path "svv.zip" `
            -DestinationPath "svv" -Force

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppId=WaslaApp
          AppName=Wasla
          AppVersion=1.0.0
          AppPublisher=Wasla App
          DefaultDirName={autopf}\Wasla
          DefaultGroupName=Wasla
          OutputDir=build\installer
          OutputBaseFilename=Wasla_Setup
          SetupIconFile=windows\runner\resources\app_icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          [Tasks]
          Name: "desktopicon"; Flags: checkedonce
          Name: "vbcable"; Flags: checkedonce

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "vbcable\*"; DestDir: "{tmp}\vbcable"; Flags: deleteafterinstall recursesubdirs; Tasks: vbcable
          Source: "svv\SoundVolumeView.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Wasla"; Filename: "{app}\wasla.exe"
          Name: "{autodesktop}\Wasla"; Filename: "{app}\wasla.exe"; Tasks: desktopicon

          [Run]
          Filename: "{tmp}\vbcable\VBCABLE_Setup_x64.exe"; Parameters: "/S"; WorkingDir: "{tmp}\vbcable"; Flags: waituntilterminated runhidden; Tasks: vbcable
          Filename: "reg.exe"; Parameters: "add ""HKCU\SOFTWARE\Microsoft\Multimedia\Audio"" /v UserDuckingPreference /t REG_DWORD /d 3 /f"; Flags: runhidden waituntilterminated
          Filename: "{app}\wasla.exe"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "reg.exe"; Parameters: "add ""HKCU\SOFTWARE\Microsoft\Multimedia\Audio"" /v UserDuckingPreference /t REG_DWORD /d 1 /f"; Flags: runhidden waituntilterminated
          "@
          Set-Content -Path wasla.iss -Value $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" wasla.iss

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: wasla-windows-setup
          path: build/installer/Wasla_Setup.exe
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  create-release:
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Wasla Build #${{ github.run_number }}"
          body: |
            Commit: ${{ github.sha }}
          files: |
            release-artifacts/wasla-android-apk/app-release.apk
            release-artifacts/wasla-linux-deb/wasla_1.0.0_amd64.deb
            release-artifacts/wasla-linux-portable/wasla_1.0.0_linux_portable.tar.gz
            release-artifacts/wasla-linux-appimage/Wasla-x86_64.AppImage
            release-artifacts/wasla-windows-setup/Wasla_Setup.exe
          draft: false
          prerelease: false
