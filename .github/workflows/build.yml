name: 🚀 Build Wasla — All Platforms

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wasla-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: 🐧 Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libsecret-1-dev \
            pkg-config ninja-build dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package as .deb
        run: |
          STAGE="build/debian_package"
          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/usr/bin"
          mkdir -p "$STAGE/usr/lib/wasla"
          mkdir -p "$STAGE/usr/share/applications"
          mkdir -p "$STAGE/usr/share/pixmaps"

          cp -r build/linux/x64/release/bundle/* "$STAGE/usr/lib/wasla/"

          printf '#!/bin/bash\n/usr/lib/wasla/wasla "$@"\n' \
            > "$STAGE/usr/bin/wasla"
          chmod +x "$STAGE/usr/bin/wasla"

          LOGO=$(find assets/images -name "*.png" | head -1)
          [ -n "$LOGO" ] && cp "$LOGO" "$STAGE/usr/share/pixmaps/wasla.png"

          cat > "$STAGE/usr/share/applications/wasla.desktop" << 'DESKTOP'
[Desktop Entry]
Version=1.0
Type=Application
Name=Wasla
Comment=Local P2P Communication App
Exec=wasla
Icon=wasla
Terminal=false
Categories=Network;Chat;
DESKTOP

          cat > "$STAGE/DEBIAN/control" << 'CONTROL'
Package: wasla
Version: 1.0.0
Architecture: amd64
Maintainer: Omar Hamada <omarworknow@gmail.com>
Depends: libc6, libgtk-3-0, libglib2.0-0, libsecret-1-0
Section: net
Priority: standard
Description: Local P2P Communication Application
 Wasla is a decentralized peer-to-peer communication app
 built with Flutter and WebRTC for local network use.
CONTROL

          chmod 755 "$STAGE/DEBIAN"
          chmod 644 "$STAGE/DEBIAN/control"
          dpkg-deb --build "$STAGE" "build/wasla_1.0.0_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: wasla-linux-deb
          path: build/wasla_1.0.0_amd64.deb

  build-windows:
    name: 🪟 Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package as ZIP
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "build\wasla-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst
          Write-Host "✅ ZIP created at $dst"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wasla-windows-zip
          path: build/wasla-windows.zip
